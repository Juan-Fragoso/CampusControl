name: Laravel CI-CD Master

on:
  push:
    branches: [ "master" ]

env:
  APP_NAME: app-laravel
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código de tu repositorio a la máquina virtual de GitHub
      - name: Descargar Código
        uses: actions/checkout@v4

      # 2. Instalar Docker y Docker Compose
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Configurar las llaves maestras de AWS (Se leen desde los Secrets de GitHub)
      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Asegúrate de que coincida con tu región de AWS

      # 4. Autenticar Docker con Amazon ECR para poder subir imágenes
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Construir la imagen y subirla al repositorio de AWS
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: campuscontrol # <--- DEBE coincidir con el nombre en AWS ECR
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Construimos la imagen usando tu Dockerfile
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          # Las subimos a la nube de AWS
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 5. (OPCIONAL pero recomendado) Correr migraciones después de subir
      # Nota: Esto solo funciona si ya tienes la DB RDS configurada en AWS
      - name: Run Migrations on AWS
        run: |
          docker run --rm $ECR_REGISTRY/$ECR_REPOSITORY:latest php artisan migrate --force
